[package]
name = "tpk-resolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layered overlay resolution for TPK packs: tombstones, index, LRU cache, CSP hashes."

[dependencies]
tpk-format.workspace = true
sha2.workspace = true
globset.workspace = true
log.workspace = true
thiserror.workspace = true
base64.workspace = true

[features]
default = []
# Dev-only: lets the overlay tests build real signed packs to resolve against.
test-packs = ["tpk-format/pack"]
# See tpk-format for what these mean. Forwarded so the match arms here and the
# variants there are added and removed together.
app-store = ["tpk-format/app-store"]
__all = ["tpk-format/__all"]

[dev-dependencies]
tempfile.workspace = true
