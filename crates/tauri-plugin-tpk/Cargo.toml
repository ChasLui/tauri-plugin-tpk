[package]
name = "tauri-plugin-tpk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OTA frontend updates for Tauri v2 — signed TPK content packs, layered overlay, three-state rollback. Self-hosted, no binary rebuild."
documentation = "https://docs.rs/tauri-plugin-tpk"
# README.md is copied in from the repo root by the release workflow; see
# .github/workflows/release.yml. Keep it out of git (see .gitignore).
readme = "README.md"
keywords = ["tauri", "plugin", "ota", "tpk", "update"]
categories = ["gui", "web-programming"]
links = "tauri-plugin-tpk"

[lib]
name = "tauri_plugin_tpk"
path = "src/lib.rs"

[dependencies]
tpk-format.workspace = true
tpk-resolve.workspace = true
tpk-store.workspace = true
tpk-client.workspace = true
tpk-delta.workspace = true
tauri-utils = "2"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
log.workspace = true
reqwest.workspace = true
tokio.workspace = true
semver.workspace = true
thiserror.workspace = true
url.workspace = true

# TLS: native-tls on desktop, rustls on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
tempfile.workspace = true
tpk-format = { workspace = true, features = ["pack"] }
tokio = { version = "1", features = ["rt", "macros"] }
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
