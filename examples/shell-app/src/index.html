<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPK Example</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>TPK Example</h1>
  <p class="revision">Revision: <code id="revision">embedded</code></p>

  <div id="status">Loading…</div>

  <div class="actions">
    <button id="btn-check">Check</button>
    <button id="btn-download" disabled>Download</button>
    <button id="btn-status">Refresh status</button>
  </div>

  <div id="progress" hidden>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <small id="progress-text"></small>
  </div>

  <pre id="log"></pre>

  <!-- No inline script: `tpk pack` rejects HTML containing inline or remote
       <script>, so this page can be shipped as a pack unchanged. -->
  <script type="module" src="./main.js"></script>
</body>
</html>
