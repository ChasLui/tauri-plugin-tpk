name: Fuzz and bench

# Deliberately not on push or pull_request: a fuzz run that is long enough to
# find anything is too long to gate a PR on, and a criterion run on a shared
# runner is too noisy to gate anything on at all. Weekly, plus on demand.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "300"
  schedule:
    # Sundays, 03:17 UTC — off the hour, where every other cron in the world is.
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [path_parse, manifest_parse, container_open, delta_apply]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # cargo-fuzz needs nightly for -Z sanitizer. Same action pin as the rest
      # of CI; the toolchain is chosen by the input, not by the ref.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz
        working-directory: fuzz
        run: |
          # -runs is unbounded; -max_total_time is the wall clock we actually
          # budget. A crash makes cargo-fuzz exit non-zero, which fails the job.
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || '300' }} \
            -rss_limit_mb=4096

      # The reproducer is the only thing worth keeping from a failed run.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      # Shared runners are too noisy for a regression threshold, so this only
      # records numbers. Read them, do not gate on them.
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee bench.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: bench.txt
