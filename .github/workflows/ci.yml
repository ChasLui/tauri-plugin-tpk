name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Rustdoc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  guest-js:
    name: Guest JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Install
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm build

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      # rust-version is a promise to downstream users; without this job it
      # silently drifts as dependencies raise their own MSRV.
      - name: Check against declared MSRV
        run: cargo check --workspace --all-features

  example:
    name: Example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      # examples/ is a separate workspace, so --workspace above never covers it.
      # Without this job it rots unnoticed.
      - name: Check example
        run: cargo check --manifest-path examples/shell-app/src-tauri/Cargo.toml

  package:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      # release.yml does this too, but only once a tag exists — by which point a
      # packaging problem means an aborted release rather than a red PR. The
      # failures this catches are invisible to `cargo build`: a `readme` that
      # points outside the package root, a path dependency published without a
      # version, a file that `cargo package` excludes but the build needed.
      - name: Stage README for the plugin crate
        run: cp README.md crates/tauri-plugin-tpk/README.md

      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The rename is only finished if none of the old identity survives. The
      # changelog keeps its history, and the migration guide has to name the
      # thing it migrates from.
      - name: No leftover hotswap identity
        run: |
          # This workflow names the strings it is looking for, so exclude it
          # along with the changelog's history and the migration guide. Links
          # *to* the migration guide are legitimate, so drop those lines too.
          if rg -i --glob '!CHANGELOG.md' --glob '!docs/migrating-from-hotswap.md' \
                  --glob '!Cargo.lock' --glob '!.github/workflows/ci.yml' \
                  -e 'hotswap' -e 'denniskribl' -e 'kribl\.io' . \
               | grep -v 'migrating-from-hotswap'; then
            echo "::error::found references to the previous project identity"
            exit 1
          fi

      # A doc without a symlink is a doc the site never shows.
      - name: Docs and website are in sync
        run: |
          missing=0
          for doc in docs/*.md; do
            name=$(basename "$doc")
            # README.md is rendered by sync-readme.mjs into index/readme pages.
            [ "$name" = "README.md" ] && continue
            if [ ! -e "website/src/content/docs/$name" ]; then
              echo "::error file=$doc::no symlink in website/src/content/docs/"
              missing=1
            fi
          done
          exit $missing

      - name: Runtime carries no C toolchain dependency
        run: |
          # zstd decoding at runtime is pure-Rust ruzstd; the C encoder is
          # CLI-only. deny.toml pins who may reach it, this catches the case
          # where someone reaches it from the plugin itself.
          if cargo tree -p tauri-plugin-tpk --edges normal --prefix none | grep -q zstd-sys; then
            echo "::error::zstd-sys reached the runtime dependency graph"
            exit 1
          fi
