name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Guest API — install
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm install --frozen-lockfile

      - name: Guest API — build
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm build

      - name: Build docs
        working-directory: website
        run: pnpm install --frozen-lockfile && pnpm build

  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract tag version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A pure [workspace] root has no top-level `version` key, so the old
      # `grep -m1 '^version'` would read the wrong line. Use cargo metadata.
      - name: Check every crate version matches the tag
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BAD=$(cargo metadata --no-deps --format-version 1 \
                | jq -r --arg v "$VERSION" '.packages[] | select(.version != $v) | .name')
          if [ -n "$BAD" ]; then
            echo "ERROR: these crates do not match tag version ${VERSION}:"
            echo "$BAD"
            exit 1
          fi
          echo "all workspace crates at ${VERSION}"

      - name: Check crates inherit the workspace version
        run: |
          BAD=$(grep -L 'version.workspace = true' crates/*/Cargo.toml || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: these crates do not inherit [workspace.package].version:"
            echo "$BAD"
            exit 1
          fi

      - name: Check only the plugin crate declares `links`
        run: |
          BAD=$(grep -l '^links' crates/*/Cargo.toml | grep -v 'crates/tauri-plugin-tpk/' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: the links key must be unique to the plugin crate; found in:"
            echo "$BAD"
            exit 1
          fi

      - name: Check Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check npm package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/tauri-plugin-tpk-api/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: npm package version '${PKG_VERSION}' does not match tag '${{ steps.tag.outputs.version }}'"
            exit 1
          fi
          echo "npm package version OK: ${PKG_VERSION}"

      - name: Check CHANGELOG.md contains version heading
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          if ! grep -qE "^##[[:space:]].*${VERSION}" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain a heading for version '${VERSION}'"
            exit 1
          fi
          echo "CHANGELOG.md heading OK for version: ${VERSION}"

  publish-rust:
    name: Publish (crates.io)
    runs-on: ubuntu-latest
    needs: validate-version
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      # `readme = "README.md"` points at a file that only exists at the repo
      # root; copy it in so `cargo package` can embed it.
      - name: Stage README for the plugin crate
        run: cp README.md crates/tauri-plugin-tpk/README.md

      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

      # cargo resolves the topological order and waits for index propagation.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --workspace

  publish-npm:
    name: Publish (npm)
    runs-on: ubuntu-latest
    needs: validate-version
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Install
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/tauri-plugin-tpk-api
        run: pnpm build

      - name: Publish to npm
        working-directory: packages/tauri-plugin-tpk-api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-rust, publish-npm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract tag version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Extract everything between the heading for this version and the next heading
          NOTES=$(awk "/^##[[:space:]].*${VERSION}/{found=1; next} found && /^##[[:space:]]/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "WARNING: No release notes found for version ${VERSION} in CHANGELOG.md"
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to a temp file to safely pass multiline content
          printf '%s' "$NOTES" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"
